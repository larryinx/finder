curator:
  kind: react_staged
  llm_model: ${oc.env:CURATOR_LLM_MODEL,${oc.env:AGENT_LLM_MODEL,Qwen/Qwen3.6-35B-A3B}}
  llm_base_url: ${oc.env:CURATOR_LLM_BASE_URL,${oc.env:AGENT_LLM_BASE_URL,http://localhost:8000/v1}}
  llm_api_key: ${oc.env:CURATOR_LLM_API_KEY,${oc.env:AGENT_LLM_API_KEY,EMPTY}}
  max_react_turns: 36
  # ── LLM sampling for the curator ReAct loop ─────────────────────
  # ``llm_provider`` chooses openai_compat (any OpenAI-compatible
  # server) vs openrouter (langchain-openrouter). Falls back to
  # ``AGENT_LLM_PROVIDER`` so flipping one env var moves all four
  # ReAct loops together; override with ``CURATOR_LLM_PROVIDER`` to
  # mix providers.
  llm_provider: ${oc.env:CURATOR_LLM_PROVIDER,${oc.env:AGENT_LLM_PROVIDER,openai_compat}}
  # ``llm_api_flavor`` chooses chat_completions (HiExp's reasoning
  # wrapper — preserves reasoning_content across turns when thinking
  # is on) vs responses (OpenAI Responses API; reasoning handled
  # natively). Ignored when ``llm_provider=openrouter``.
  llm_api_flavor: chat_completions
  enable_thinking: false
  # Only meaningful when ``enable_thinking: true``. When both flags
  # are on AND llm_api_flavor=chat_completions, prior turn's
  # reasoning_content is re-injected on each request so the curator
  # ReAct loop "remembers" its own thinking.
  preserve_thinking: true
  temperature: 0.2
  top_p: 0.95
  max_response_tokens: 8192
  llm_timeout_s: 600.0
  conservativeness:
    max_add_per_step: 5
    max_modify_per_step: 5
    max_delete_per_step: 5
    max_total_edits_per_step: 12
  # Playbook size budget, in characters of the rendered playbook. Keep
  # the whole playbook tight — small playbooks evaluated better than
  # large ones.
  char_budget: 32000
  reject_if_over_budget_ratio: 1.2
  # Hard per-stage bullet cap — stops the monotone-bloat anti-learning
  # (v2-5 grew 3→21 with 0 DELETE and accuracy fell as it grew). At the
  # cap the curator must MODIFY/DELETE instead of ADD.
  max_bullets_per_section: 16
  max_leftover_size: 200
