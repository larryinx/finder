reflector:
  kind: querychain_tactic
  llm_model: ${oc.env:REFLECTOR_LLM_MODEL,${oc.env:AGENT_LLM_MODEL,Qwen/Qwen3.6-35B-A3B}}
  llm_base_url: ${oc.env:REFLECTOR_LLM_BASE_URL,${oc.env:AGENT_LLM_BASE_URL,http://localhost:8000/v1}}
  llm_api_key: ${oc.env:REFLECTOR_LLM_API_KEY,${oc.env:AGENT_LLM_API_KEY,EMPTY}}
  mcp_url: ${oc.env:AGENT_MCP_URL,http://127.0.0.1:8080/mcp}
  mcp_transport: ${oc.env:AGENT_MCP_TRANSPORT,sse}
  tool_call_timeout_s: 60.0
  # ── Trajectory rendering. These knobs control how BOTH the agent's
  #    own (incorrect) trajectory and the SHORTEST CORRECT contrast
  #    trajectory are rendered in the reflector prompt.
  traj_tool_result_visibility: title
  traj_tool_result_max_chars_total: 5000
  traj_tool_result_max_chars_per_hit: 1000
  traj_reasoning_chars_per_step: 1000
  # ── LIVE search tool calls the reflector itself makes during ReAct.
  live_tool_result_visibility: full
  live_tool_result_max_chars_total: 1500
  live_tool_result_max_chars_per_hit: 500
  max_react_turns: 20
  max_search_calls: 20
  concurrency: 4
  allow_no_useful_insight: true
  # ── LLM sampling for the reflector ReAct loop ─────────────────────
  # Same conventions as querychain_staged; see
  # config/ttl/reflector/querychain_staged.yaml for the full annotation.
  llm_provider: ${oc.env:REFLECTOR_LLM_PROVIDER,${oc.env:AGENT_LLM_PROVIDER,openai_compat}}
  llm_api_flavor: chat_completions
  enable_thinking: false
  preserve_thinking: true
  temperature: 1.0
  top_p: 0.95
  max_response_tokens: 8192
  llm_timeout_s: 600.0
